[project]
name = "railflow-api"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.136", "uvicorn>=0.30", "railflow-engine"]

[tool.uv.sources]
railflow-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/railflow_api"]
