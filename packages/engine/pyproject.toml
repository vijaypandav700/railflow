[project]
name = "railflow-engine"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "ortools>=9.15.6755",
    "pydantic>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/railflow"]

[project.scripts]
railflow = "railflow.cli:main"
