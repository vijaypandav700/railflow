name: railflow
services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    environment:
      RAILFLOW_AI_MODE: rules
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["audit:/data"]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      api: { condition: service_healthy }
  api-test:
    profiles: ["test"]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: test }
  web-test:
    profiles: ["test"]
    build: { context: ., dockerfile: apps/web/Dockerfile, target: build }
    working_dir: /app/apps/web
    command: ["pnpm", "test"]
volumes:
  audit: {}
