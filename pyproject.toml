[project]
name = "railflow-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["railflow-engine"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.workspace]
members = ["packages/engine"]

[tool.uv.sources]
railflow-engine = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
