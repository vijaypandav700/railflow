[project]
name = "railflow-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["railflow-engine", "railflow-api"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.uv.workspace]
members = ["packages/engine", "apps/api"]

[tool.uv.sources]
railflow-engine = { workspace = true }
railflow-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
